name: Build portable packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -e . -r requirements-build.txt
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Check source
        run: python -m compileall -q linxia app.py tools
      - name: Build and verify portable package
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: LinXia-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
